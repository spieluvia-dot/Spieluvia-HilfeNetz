name: Alte Actions-Artefakte bereinigen

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur anzeigen, nichts löschen'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

concurrency:
  group: artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Alte Artefakte sicher bereinigen
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          import os, json, urllib.request, urllib.error, datetime, time

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_TOKEN"]
          dry_run = os.environ["EVENT_NAME"] != "schedule" and os.environ.get("INPUT_DRY_RUN", "true").lower() != "false"
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = now - datetime.timedelta(days=7)
          base = "https://api.github.com"
          headers = {"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "joho-safe-artifact-cleanup"}

          def api(path, method="GET"):
              request = urllib.request.Request(base + path, headers=headers, method=method)
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None

          artifacts = []
          page = 1
          while True:
              result = api(f"/repos/{repo}/actions/artifacts?per_page=100&page={page}")
              batch = result.get("artifacts", [])
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
              if page > 100:
                  raise RuntimeError("Mehr als 10.000 Artefakte: aus Sicherheitsgründen abgebrochen.")

          run_ids = sorted({a.get("workflow_run", {}).get("id") for a in artifacts
                            if a.get("workflow_run") and a.get("workflow_run", {}).get("id")}, reverse=True)
          run_status = {}
          for run_id in run_ids:
              run = api(f"/repos/{repo}/actions/runs/{run_id}")
              run_status[run_id] = (run.get("status"), run.get("conclusion"))
              time.sleep(0.03)

          successful = sorted((rid for rid in run_ids if run_status[rid] == ("completed", "success")), reverse=True)
          protected_runs = set(successful[:3])
          print(f"Repository: {repo}; Artefakte: {len(artifacts)}; erfolgreiche Artefakt-Builds: {len(successful)}")
          print(f"Geschützte letzte drei erfolgreiche Builds: {sorted(protected_runs)}")
          print(f"Schonfrist: 7 Tage; Modus: {'VORSCHAU' if dry_run else 'LÖSCHEN'}")
          freed = 0
          count = 0
          for a in artifacts:
              rid = (a.get("workflow_run") or {}).get("id")
              created = datetime.datetime.fromisoformat(a["created_at"].replace("Z", "+00:00"))
              # Never delete unknown provenance, recent artifacts, or the last 3 successful builds.
              if rid is None or rid in protected_runs or created >= cutoff:
                  continue
              # Never delete artifacts of still-running builds.
              if run_status.get(rid, (None, None))[0] != "completed":
                  continue
              print(f"{'WÜRDE LÖSCHEN' if dry_run else 'LÖSCHE'}: {a['name']} ({a['size_in_bytes']/1048576:.1f} MiB), Run {rid}")
              if not dry_run:
                  api(f"/repos/{repo}/actions/artifacts/{a['id']}", method="DELETE")
              freed += a["size_in_bytes"]
              count += 1
          print(f"Ergebnis: {count} Artefakte, {freed/1048576:.1f} MiB {'potenziell' if dry_run else 'zur Löschung angewiesen'}.")
